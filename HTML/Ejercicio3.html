<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
</head>
<body>

    <h1>Formulario de Registro</h1>

    <form action="#" method="post">
        <fieldset>
            <legend>Información Personal</legend>
            <label for="nombre">Nombre:</label> <input type="text" id="nombre" name="nombre" required><br>
            <label for="apellido">Apellido:</label> <input type="text" id="apellido" name="apellido" required><br>
            <label for="fecha">Fecha de Nacimiento:</label> <input type="date" id="fecha" name="fecha" required><br>
            <label>Género:</label>
            <input type="radio" id="masc" name="genero" value="masculino" required> <label for="masc">Masculino</label>
            <input type="radio" id="fem" name="genero" value="femenino"> <label for="fem">Femenino</label>
            <input type="radio" id="otro" name="genero" value="otro"> <label for="otro">Otro</label>
        </fieldset>

<br><br>

        <fieldset>
            <legend>Información de Contacto</legend>
            <label for="correo">Correo Electrónico:</label> <input type="email" id="correo" name="correo" required><br>
            <label for="telefono">Teléfono:</label> <input type="tel" id="telefono" name="telefono" required><br>
            <label for="direccion">Dirección:</label> <textarea id="direccion" name="direccion" rows="3"></textarea>
        </fieldset>
        
<br><br>

        <fieldset>
            <legend>Información de Cuenta</legend>
            <label for="usuario">Usuario:</label> <input type="text" id="usuario" name="usuario" required><br>
            <label for="pass">Contraseña:</label> <input type="password" id="pass" name="pass" required><br>
            <label for="pass2">Confirmar Contraseña:</label> <input type="password" id="pass2" name="pass2" required>
        </fieldset>

<br><br>

        <fieldset>
            <legend>Preferencias</legend>
            <label for="color">Color Favorito:</label>
            <select id="color" name="color">
                <option value="rojo">Rojo</option>
                <option value="azul">Azul</option>
                <option value="verde">Verde</option>
                <option value="amarillo">Amarillo</option>
            </select><br>
            <input type="checkbox" id="terminos" name="terminos" required> <label for="terminos">Aceptar Términos y Condiciones</label>
        </fieldset>

        <br>
        <button type="submit">Enviar Registro</button>
    </form>

</body>
</html>
